services:
  traefik:
    image: traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "443:443"
    volumes:
      - traefik:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Placeholder router ONLY to make Traefik issue a Let's Encrypt cert for
  # mail.<BASE_DOMAIN> (docker-mailserver reads it from acme.json). No real
  # traffic is expected here.
  mailcert:
    image: traefik/whoami
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailcert.rule=Host(`mail.${BASE_DOMAIN}`)
      - traefik.http.routers.mailcert.tls=true
      - traefik.http.routers.mailcert.entrypoints=web,websecure
      - traefik.http.routers.mailcert.tls.certresolver=mytlschallenge
      - traefik.http.services.mailcert.loadbalancer.server.port=80

  # docker-mailserver (SMTP relay for AppFlowy). Env config is tracked in services/mailserver-config/mailserver.env.
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    # NOTE: Replace `mail.${BASE_DOMAIN}` value via BASE_DOMAIN in .env once set.
    hostname: mail.${BASE_DOMAIN}
    env_file:
      - ./services/mailserver-config/mailserver.env
    depends_on:
      - traefik
    ports:
      - "25:25"    # SMTP  (explicit TLS => STARTTLS, Authentication is DISABLED => use port 465/587 instead)
      - "465:465"  # ESMTP (implicit TLS)
      - "587:587"  # ESMTP (explicit TLS => STARTTLS)
    volumes:
      - ./docker/mailserver/docker-data/dms/mail-data/:/var/mail/
      - ./docker/mailserver/docker-data/dms/mail-state/:/var/mail-state/
      - ./docker/mailserver/docker-data/dms/mail-logs/:/var/log/mail/
      - ./docker/mailserver/docker-data/dms/config/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
      # Traefik ACME store -> TLS cert for SMTP (docker-mailserver reads acme.json natively).
      - traefik:/etc/letsencrypt:ro
    restart: always
    stop_grace_period: 1m
    cap_add:
      - NET_ADMIN

  db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASS}
      - POSTGRES_DB=${N8N_DB}
    volumes:
      - db:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always

  n8n:
    image: docker.n8n.io/n8nio/n8n
    depends_on:
      - db
      - redis
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.${BASE_DOMAIN}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${BASE_DOMAIN}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - N8N_HOST=n8n.${BASE_DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.${BASE_DOMAIN}/
      - GENERIC_TIMEZONE=${TIMEZONE}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${N8N_DB}
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_SCHEMA=public
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASS}
    volumes:
      - n8n:/home/node/.n8n
      - ./docker/n8n/files:/files

  evolution:
    image: evoapicloud/evolution-api:latest
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.evolution.rule=Host(`evolution.${BASE_DOMAIN}`)
      - traefik.http.routers.evolution.tls=true
      - traefik.http.routers.evolution.entrypoints=web,websecure
      - traefik.http.routers.evolution.tls.certresolver=mytlschallenge
      - traefik.http.services.evolution.loadbalancer.server.port=8080
      - traefik.http.middlewares.evolution.headers.SSLRedirect=true
      - traefik.http.middlewares.evolution.headers.STSSeconds=315360000
      - traefik.http.middlewares.evolution.headers.browserXSSFilter=true
      - traefik.http.middlewares.evolution.headers.contentTypeNosniff=true
      - traefik.http.middlewares.evolution.headers.forceSTSHeader=true
      - traefik.http.middlewares.evolution.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.evolution.headers.STSPreload=true
      - traefik.http.routers.evolution.middlewares=evolution@docker
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_APIKEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://${POSTGRES_USER}:${POSTGRES_PASS}@db:5432/${EVOLUTION_DB}?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_exchange
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
      - CONFIG_SESSION_PHONE_VERSION=${EVOLUTION_WSP_VERSION}
    volumes:
      - evolution:/evolution/instances

  vaultwarden:
    image: vaultwarden/server:latest
    restart: unless-stopped
    volumes:
      - ./docker/vaultwarden:/data
    environment:
      SIGNUPS_ALLOWED: "true"
      DOMAIN: https://vaultwarden.${BASE_DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.${BASE_DOMAIN}`)
      - traefik.http.routers.vaultwarden.tls=true
      - traefik.http.routers.vaultwarden.entrypoints=web,websecure
      - traefik.http.routers.vaultwarden.tls.certresolver=mytlschallenge
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80
      - traefik.http.middlewares.vaultwarden.headers.SSLRedirect=true
      - traefik.http.middlewares.vaultwarden.headers.STSSeconds=315360000
      - traefik.http.middlewares.vaultwarden.headers.browserXSSFilter=true
      - traefik.http.middlewares.vaultwarden.headers.contentTypeNosniff=true
      - traefik.http.middlewares.vaultwarden.headers.forceSTSHeader=true
      - traefik.http.middlewares.vaultwarden.headers.SSLHost=${BASE_DOMAIN}
      - traefik.http.middlewares.vaultwarden.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.vaultwarden.headers.STSPreload=true
      - traefik.http.routers.vaultwarden.middlewares=vaultwarden@docker

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    volumes:
      - ./docker/wordpress/wp-content:/var/www/html/wp-content
    environment:
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME}
      - WORDPRESS_TABLE_PREFIX=wp_
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER}
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASS}
    labels:
      - traefik.enable=true
      - traefik.http.routers.wordpress.rule=Host(`blog.${BASE_DOMAIN}`)
      - traefik.http.routers.wordpress.tls=true
      - traefik.http.routers.wordpress.entrypoints=web,websecure
      - traefik.http.routers.wordpress.tls.certresolver=mytlschallenge
      - traefik.http.services.wordpress.loadbalancer.server.port=80
      - traefik.http.middlewares.wordpress.headers.SSLRedirect=true
      - traefik.http.middlewares.wordpress.headers.STSSeconds=315360000
      - traefik.http.middlewares.wordpress.headers.browserXSSFilter=true
      - traefik.http.middlewares.wordpress.headers.contentTypeNosniff=true
      - traefik.http.middlewares.wordpress.headers.forceSTSHeader=true
      - traefik.http.middlewares.wordpress.headers.SSLHost=${BASE_DOMAIN}
      - traefik.http.middlewares.wordpress.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.wordpress.headers.STSPreload=true
      - traefik.http.routers.wordpress.middlewares=wordpress@docker
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    volumes:
      - mariadb:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${WORDPRESS_DB_PASS}
      - MYSQL_USER=${WORDPRESS_DB_USER}
      - MYSQL_PASSWORD=${WORDPRESS_DB_PASS}
      - MYSQL_DATABASE=${WORDPRESS_DB_NAME}

  #pagent:
  #  build:
    #    context: ./services/pagent
  #    dockerfile: Dockerfile
  #    args:
  #      - VITE_API_URL=${PAGENT_API_URL}
  #      - VITE_AGENT_NAME=${PAGENT_AGENT_NAME}
  #      - MAX_MESSAGE_LENGTH=${PAGENT_MESSAGE_LENGTH}
  #  restart: unless-stopped
  #  depends_on:
  #    - redis
  #  labels:
  #    - traefik.enable=true
  #    - traefik.http.routers.pagent.rule=Host(`pagent.${BASE_DOMAIN}`)
  #    - traefik.http.routers.pagent.tls=true
  #    - traefik.http.routers.pagent.entrypoints=web,websecure
  #    - traefik.http.routers.pagent.tls.certresolver=mytlschallenge
  #    - traefik.http.services.pagent.loadbalancer.server.port=80
  #    - traefik.http.middlewares.pagent.headers.SSLRedirect=true
  #    - traefik.http.middlewares.pagent.headers.STSSeconds=315360000
  #    - traefik.http.middlewares.pagent.headers.browserXSSFilter=true
  #    - traefik.http.middlewares.pagent.headers.contentTypeNosniff=true
  #    - traefik.http.middlewares.pagent.headers.forceSTSHeader=true
  #    - traefik.http.middlewares.pagent.headers.SSLHost=${BASE_DOMAIN}
  #    - traefik.http.middlewares.pagent.headers.STSIncludeSubdomains=true
  #    - traefik.http.middlewares.pagent.headers.STSPreload=true
  #    - traefik.http.routers.pagent.middlewares=pagent@docker
  #  env_file:
    #    - ./services/pagent/.env

  billuyo:
    build:
      context: ./services/billuyo
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.billuyo.rule=Host(`billuyo.${BASE_DOMAIN}`)
      - traefik.http.routers.billuyo.tls=true
      - traefik.http.routers.billuyo.entrypoints=web,websecure
      - traefik.http.routers.billuyo.tls.certresolver=mytlschallenge
      - traefik.http.services.billuyo.loadbalancer.server.port=80
      - traefik.http.middlewares.billuyo.headers.SSLRedirect=true
      - traefik.http.middlewares.billuyo.headers.STSSeconds=315360000
      - traefik.http.middlewares.billuyo.headers.browserXSSFilter=true
      - traefik.http.middlewares.billuyo.headers.contentTypeNosniff=true
      - traefik.http.middlewares.billuyo.headers.forceSTSHeader=true
      - traefik.http.middlewares.billuyo.headers.SSLHost=${BASE_DOMAIN}
      - traefik.http.middlewares.billuyo.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.billuyo.headers.STSPreload=true
      - traefik.http.routers.billuyo.middlewares=billuyo@docker

  # ================= AppFlowy Cloud =================
  appflowy_nginx:
    restart: on-failure
    image: nginx
    volumes:
      - ./services/appflowy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - appflowy_cloud
    labels:
      - traefik.enable=true
      - traefik.http.routers.appflowy.rule=Host(`appflowy.${BASE_DOMAIN}`)
      - traefik.http.routers.appflowy.tls=true
      - traefik.http.routers.appflowy.entrypoints=web,websecure
      - traefik.http.routers.appflowy.tls.certresolver=mytlschallenge
      - traefik.http.services.appflowy.loadbalancer.server.port=80
      - traefik.http.middlewares.appflowy.headers.SSLRedirect=true
      - traefik.http.middlewares.appflowy.headers.STSSeconds=315360000
      - traefik.http.middlewares.appflowy.headers.browserXSSFilter=true
      - traefik.http.middlewares.appflowy.headers.contentTypeNosniff=true
      - traefik.http.middlewares.appflowy.headers.forceSTSHeader=true
      - traefik.http.middlewares.appflowy.headers.SSLHost=${BASE_DOMAIN}
      - traefik.http.middlewares.appflowy.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.appflowy.headers.STSPreload=true
      - traefik.http.routers.appflowy.middlewares=appflowy@docker

  appflowyminio:
    restart: on-failure
    image: minio/minio
    env_file:
      - ./services/appflowy/.env
    environment:
      - MINIO_BROWSER_REDIRECT_URL=https://appflowy.${BASE_DOMAIN}/minio
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - appflowy_minio_data:/data

  appflowy_postgres:
    restart: on-failure
    image: pgvector/pgvector:pg16
    env_file:
      - ./services/appflowy/.env
    command: [ "postgres", "-c", "port=${POSTGRES_PORT:-5432}" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${POSTGRES_PORT}" ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - appflowy_postgres_data:/var/lib/postgresql/data

  gotrue:
    restart: on-failure
    depends_on:
      appflowy_postgres:
        condition: service_healthy
    healthcheck:
      test: "curl --fail http://127.0.0.1:9999/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    image: appflowyinc/gotrue:${GOTRUE_VERSION:-latest}
    env_file:
      - ./services/appflowy/.env
    environment:
      - GOTRUE_SITE_URL=appflowy-flutter://
      - GOTRUE_URI_ALLOW_LIST=**
      - GOTRUE_DISABLE_SIGNUP=false
      - GOTRUE_JWT_ADMIN_GROUP_NAME=supabase_admin
      - GOTRUE_DB_DRIVER=postgres
      - API_EXTERNAL_URL=https://appflowy.${BASE_DOMAIN}/gotrue
      - PORT=9999
      - GOTRUE_MAILER_AUTOCONFIRM=false
      - GOTRUE_MAILER_URLPATHS_CONFIRMATION=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_INVITE=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_RECOVERY=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE=/gotrue/verify

  appflowy_cloud:
    restart: on-failure
    image: appflowyinc/appflowy_cloud:${APPFLOWY_CLOUD_VERSION:-latest}
    env_file:
      - ./services/appflowy/.env
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - APPFLOWY_ENVIRONMENT=production
      - APPFLOWY_GOTRUE_BASE_URL=http://gotrue:9999
      - APPFLOWY_S3_CREATE_BUCKET=true
      - APPFLOWY_S3_USE_MINIO=true
      - APPFLOWY_S3_MINIO_URL=http://appflowyminio:9000
      - APPFLOWY_S3_REGION=
      - APPFLOWY_ACCESS_CONTROL=true
      - APPFLOWY_DATABASE_MAX_CONNECTIONS=40
      - APPFLOWY_BASE_URL=https://appflowy.${BASE_DOMAIN}
      - APPFLOWY_WEB_URL=https://appflowy.${BASE_DOMAIN}
      - APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=https://appflowy.${BASE_DOMAIN}/minio-api
      - APPFLOWY_SEARCH_SERVICE_URL=http://appflowy_search:4002
      - APPFLOWY_SEARCH_REQUEST_TIMEOUT_SECS=10
      - AI_ENABLED=false
    healthcheck:
      test: "curl --fail http://127.0.0.1:8000/api/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      gotrue:
        condition: service_healthy

  admin_frontend:
    restart: on-failure
    image: appflowyinc/admin_frontend:${APPFLOWY_ADMIN_FRONTEND_VERSION:-latest}
    environment:
      - APPFLOWY_GOTRUE_BASE_URL=http://gotrue:9999
      - APPFLOWY_BASE_URL=http://appflowy_cloud:8000
    depends_on:
      gotrue:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy

  appflowy_worker:
    restart: on-failure
    image: appflowyinc/appflowy_worker:${APPFLOWY_WORKER_VERSION:-latest}
    env_file:
      - ./services/appflowy/.env
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - APPFLOWY_ENVIRONMENT=production
      - APPFLOWY_WORKER_ENVIRONMENT=production
      - APPFLOWY_WORKER_IMPORT_TICK_INTERVAL=30
      - APPFLOWY_S3_USE_MINIO=true
      - APPFLOWY_S3_MINIO_URL=http://appflowyminio:9000
    depends_on:
      appflowy_postgres:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy

  appflowy_search:
    restart: on-failure
    image: appflowyinc/appflowy_search:${APPFLOWY_SEARCH_VERSION:-latest}
    env_file:
      - ./services/appflowy/.env
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - APPFLOWY_SEARCH_HOST=[::]
      - APPFLOWY_SEARCH_PORT=4002
      - APPFLOWY_BACKGROUND_INDEXER_ENABLED=true
      - APPFLOWY_INDEXER_DATABASE_ENABLED=false
      - APPFLOWY_KEYWORD_SEARCH_ENABLED=true
      - APPFLOWY_KEYWORD_WORKER_ENABLED=true
      - APPFLOWY_KEYWORD_INDEX_MAP_SIZE_BYTES=2147483648
      - APPFLOWY_KEYWORD_INDEX_DIR=/var/lib/appflowy/keyword_index
      - APPFLOWY_S3_USE_MINIO=true
      - APPFLOWY_S3_MINIO_URL=http://appflowyminio:9000
    volumes:
      - appflowy_keyword_index_data:/var/lib/appflowy/keyword_index
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/$${APPFLOWY_SEARCH_PORT:-4002}
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r _ status _ <&3
          [ "$$status" = 200 ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      appflowy_postgres:
        condition: service_healthy

  appflowy_web:
    restart: on-failure
    image: appflowyinc/appflowy_web:${APPFLOWY_WEB_VERSION:-latest}
    environment:
      - APPFLOWY_BASE_URL=https://appflowy.${BASE_DOMAIN}
      - APPFLOWY_GOTRUE_BASE_URL=https://appflowy.${BASE_DOMAIN}/gotrue
      - APPFLOWY_WS_BASE_URL=wss://appflowy.${BASE_DOMAIN}/ws/v2
    depends_on:
      appflowy_cloud:
        condition: service_healthy

volumes:
  traefik:
    name: remote-services_traefik
  db:
  n8n:
  evolution:
  mariadb:
  appflowy_postgres_data:
  appflowy_minio_data:
  appflowy_keyword_index_data:
