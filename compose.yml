  #    - traefik.http.middlewares.pagent.headers.forceSTSHeader=true
  #    - traefik.http.middlewares.pagent.headers.SSLHost=${BASE_DOMAIN}
  #    - traefik.http.middlewares.pagent.headers.STSIncludeSubdomains=true
  #    - traefik.http.middlewares.pagent.headers.STSPreload=true
  #    - traefik.http.routers.pagent.middlewares=pagent@docker
  #  env_file:
  #    - ./docker/pagent/.env

  billuyo:
    build:
      context: ./services/billuyo
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.billuyo.rule=Host(`billuyo.${BASE_DOMAIN}`)
      - traefik.http.routers.billuyo.tls=true
      - traefik.http.routers.billuyo.entrypoints=web,websecure
      - traefik.http.routers.billuyo.tls.certresolver=mytlschallenge
      - traefik.http.services.billuyo.loadbalancer.server.port=80
      - traefik.http.middlewares.billuyo.headers.SSLRedirect=true
      - traefik.http.middlewares.billuyo.headers.STSSeconds=315360000
      - traefik.http.middlewares.billuyo.headers.browserXSSFilter=true
      - traefik.http.middlewares.billuyo.headers.contentTypeNosniff=true
      - traefik.http.middlewares.billuyo.headers.forceSTSHeader=true
      - traefik.http.middlewares.billuyo.headers.SSLHost=${BASE_DOMAIN}
      - traefik.http.middlewares.billuyo.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.billuyo.headers.STSPreload=true
      - traefik.http.routers.billuyo.middlewares=billuyo@docker

  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - mariadb:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASS}_frankmolina
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${MYSQL_USER}

  nextcloud:
    image: nextcloud
    restart: always
    ports:
      - 8080:80
    volumes:
      - ${NEXTCLOUD_STORAGE}:/var/www/html
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_HOST=mariadb
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud.rule=Host(`cloud.${BASE_DOMAIN}`)
      - traefik.http.routers.nextcloud.tls=true
      - traefik.http.routers.nextcloud.entrypoints=web,websecure
      - traefik.http.routers.nextcloud.tls.certresolver=mytlschallenge
      - traefik.http.services.nextcloud.loadbalancer.server.port=80
      - traefik.http.middlewares.nextcloud.headers.SSLRedirect=true
      - traefik.http.middlewares.nextcloud.headers.STSSeconds=315360000
      - traefik.http.middlewares.nextcloud.headers.browserXSSFilter=true
      - traefik.http.middlewares.nextcloud.headers.contentTypeNosniff=true
      - traefik.http.middlewares.nextcloud.headers.forceSTSHeader=true
      - traefik.http.middlewares.nextcloud.headers.SSLHost=${BASE_DOMAIN}
      - traefik.http.middlewares.nextcloud.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.nextcloud.headers.STSPreload=true
      - traefik.http.routers.nextcloud.middlewares=nextcloud@docker
    
volumes:
  traefik:
  db:
  n8n:
  evolution:
  mariadb:
